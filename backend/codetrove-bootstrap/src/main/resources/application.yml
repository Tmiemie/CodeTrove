spring:
  application:
    name: codetrove
  datasource:
    url: ${CODETROVE_DB_URL}
    username: ${CODETROVE_DB_USERNAME}
    password: ${CODETROVE_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: CodeTrovePool
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 5000
      validation-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
    clean-disabled: true
  data:
    redis:
      host: ${CODETROVE_REDIS_HOST:127.0.0.1}
      port: ${CODETROVE_REDIS_PORT:6379}
      password: ${CODETROVE_REDIS_PASSWORD}
      connect-timeout: 3s
      timeout: 2s
  kafka:
    bootstrap-servers: ${CODETROVE_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
  jackson:
    default-property-inclusion: non_null

codetrove:
  node-id: ${CODETROVE_NODE_ID:1}
  repository:
    storage-root: ${CODETROVE_REPOSITORY_ROOT:./runtime/repositories}
    max-inline-blob-bytes: ${CODETROVE_REPOSITORY_MAX_INLINE_BLOB_BYTES:1048576}
  merge-request:
    max-diff-files: ${CODETROVE_MR_MAX_DIFF_FILES:200}
    max-file-patch-bytes: ${CODETROVE_MR_MAX_FILE_PATCH_BYTES:262144}
    max-total-patch-bytes: ${CODETROVE_MR_MAX_TOTAL_PATCH_BYTES:2097152}
  git:
    timeout-seconds: ${CODETROVE_GIT_TIMEOUT_SECONDS:60}
    max-request-bytes: ${CODETROVE_GIT_MAX_REQUEST_BYTES:115343360}
    max-command-bytes: ${CODETROVE_GIT_MAX_COMMAND_BYTES:1048576}
    max-object-bytes: ${CODETROVE_GIT_MAX_OBJECT_BYTES:20971520}
    max-pack-bytes: ${CODETROVE_GIT_MAX_PACK_BYTES:104857600}
    max-concurrent-requests: ${CODETROVE_GIT_MAX_CONCURRENT_REQUESTS:8}
  eventing:
    enabled: ${CODETROVE_EVENTING_ENABLED:true}
    batch-size: ${CODETROVE_OUTBOX_BATCH_SIZE:20}
    max-attempts: ${CODETROVE_OUTBOX_MAX_ATTEMPTS:8}
    send-timeout: ${CODETROVE_KAFKA_SEND_TIMEOUT:10s}
    poll-interval: ${CODETROVE_OUTBOX_POLL_INTERVAL_MS:1000}
    check-consumer-group: ${CODETROVE_CHECK_CONSUMER_GROUP:codetrove-check-v1}
    curator-consumer-group: ${CODETROVE_CURATOR_CONSUMER_GROUP:codetrove-curator-v1}
    assay-consumer-group: ${CODETROVE_ASSAY_CONSUMER_GROUP:codetrove-assay-v1}
  curator:
    enabled: ${CODETROVE_CURATOR_ENABLED:true}
    parallelism: ${CODETROVE_CURATOR_PARALLELISM:2}
    skill-timeout: ${CODETROVE_CURATOR_SKILL_TIMEOUT:3s}
    max-attempts: ${CODETROVE_CURATOR_MAX_ATTEMPTS:2}
  assay:
    enabled: ${CODETROVE_ASSAY_ENABLED:true}
    target-base-url: ${CODETROVE_ASSAY_TARGET_BASE_URL:http://127.0.0.1:18080}
  check-gate:
    enabled: ${CODETROVE_CHECK_GATE_ENABLED:true}
  auth:
    jwt-secret: ${CODETROVE_JWT_SECRET}
    access-token-ttl: 15m
    issuer: codetrove

server:
  port: ${CODETROVE_SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db,redis,kafka,ping
  info:
    env:
      enabled: true

info:
  app:
    name: CodeTrove
    description: Intelligent code collaboration and quality assurance platform
    java-version: ${java.version}

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
