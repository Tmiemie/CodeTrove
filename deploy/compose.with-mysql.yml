services:
  mysql:
    image: mysql:8.0.43
    container_name: codetrove-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: codetrove
      MYSQL_USER: codetrove_app
      MYSQL_PASSWORD: ${CODETROVE_DB_PASSWORD:?CODETROVE_DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${CODETROVE_MYSQL_ROOT_PASSWORD:?CODETROVE_MYSQL_ROOT_PASSWORD is required}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "127.0.0.1:${CODETROVE_MYSQL_PORT:-3307}:3306"
    volumes:
      - codetrove-mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent',
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - codetrove-local

volumes:
  codetrove-mysql-data:
    name: codetrove-mysql-data

networks:
  codetrove-local:
    external: true
    name: codetrove-local
